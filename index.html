<body>
<header><img src="icon-192.png" alt="" width="30" height="30"><b>GYM RAT APP</b><span id="st" role="status" aria-live="polite"></span><span id="on"></span></header>
<main id="app">Cargando…</main>
<script>
// Vigilante: si tras 7 s la app sigue en «Cargando…» (mala señal), ofrece reintentar o reparar sin tocar tus datos
setTimeout(function(){var m=document.getElementById('app');if(!m||m.textContent!=='Cargando…')return;
function b(t,f){var x=document.createElement('button');x.type='button';x.className='btn';x.textContent=t;x.onclick=f;return x}
var p=document.createElement('p');p.textContent='La app está tardando en abrir (probablemente mala señal). Tus datos están a salvo en este teléfono.';
m.textContent='';m.append(p,b('Reintentar',function(){location.reload()}),b('Reparar app (necesita internet)',function(){
var u=navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}):Promise.resolve();
u.then(function(){return window.caches?caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n)}))}):0}).then(function(){location.reload()})}))},7000);
</script>
